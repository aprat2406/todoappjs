# fly.toml app configuration file generated for todoappjs on 2025-07-01T07:38:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'todoappjs'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

